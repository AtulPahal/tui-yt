[project]
name = "tui-yt"
version = "1.0.0"
description = "A terminal UI for YouTube using video-to-ascii"
requires-python = ">=3.10"
dependencies = [
    "prompt-toolkit>=3.0.52",
    "yt-dlp>=2026.7.4",
    "opencv-python>=5.0.0.93",
    "pillow>=12.3.0",
    "pynput>=1.8.2",
    "numpy>=2.0.0",
    "sty>=1.0.6",
    "cursor>=1.3.5",
]

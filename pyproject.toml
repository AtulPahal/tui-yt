[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "tui-yt"
version = "1.0.0"
description = "A terminal UI for YouTube using video-to-ascii"
requires-python = ">=3.10"
dependencies = [
    "prompt-toolkit>=3.0.52",
    "yt-dlp>=2026.7.4",
    "opencv-python>=5.0.0.93",
    "pillow>=12.3.0",
    "pynput>=1.8.2",
    "numpy>=2.0.0",
    "sty>=1.0.6",
    "cursor>=1.3.5",
]

[project.scripts]
tui-yt = "tui:main"
[tool.setuptools]
py-modules = [
    "ascii_convert",
    "audio_player",
    "colours",
    "playback_controls",
    "tui",
    "video_player",
    "yt_saver",
]
